name: Build Nika Electron TEST

on:
  workflow_dispatch:
  push:
    branches:
      - test
    paths:
      - "desktop/main.js"
      - "desktop/preload.js"
      - "desktop/package.json"
      - "desktop/package-lock.json"
      - "desktop/electron-test.config.yml"
      - ".github/workflows/build-electron-test.yml"

permissions:
  contents: read

concurrency:
  group: nika-electron-test-build
  cancel-in-progress: true

jobs:
  windows_test:
    name: Windows TEST installer (x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout TEST code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Python for installer icon
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare isolated TEST app
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python -c "from PIL import Image; img=Image.open('static/img/logo.png').convert('RGBA'); img.save('desktop/icon.ico', format='ICO', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          Set-Content -Path desktop/nika-electron-test.json -Value '{"environment":"test","url":"https://test.nikabusiness.com"}' -NoNewline
          node --check desktop/main.js
          node --check desktop/preload.js
          if (!(Select-String -Path desktop/main.js -Pattern '"persist:nika-business-test"' -Quiet)) { throw "Missing isolated test partition" }
          if (!(Select-String -Path desktop/main.js -Pattern '"https://test.nikabusiness.com"' -Quiet)) { throw "Missing test server URL" }

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Build TEST installer (never publish a release)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --config electron-test.config.yml --win nsis --x64 --publish never

      - name: Verify isolated installer
        shell: pwsh
        run: |
          if (!(Test-Path desktop/dist-test/NikaBusiness-TEST-Setup.exe)) { throw "TEST installer missing" }
          if (Test-Path desktop/dist/NikaBusinessSetup.exe) { throw "Unexpected production installer in TEST build" }
          $size = (Get-Item desktop/dist-test/NikaBusiness-TEST-Setup.exe).Length
          if ($size -lt 1000000) { throw "Installer is unexpectedly small" }
          Write-Host "TEST installer size: $size bytes"

      - name: Upload standalone TEST download
        uses: actions/upload-artifact@v4
        with:
          name: NikaBusiness-Electron-TEST-Windows
          path: desktop/dist-test/NikaBusiness-TEST-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        shell: pwsh
        run: |
          "### Nika Business TEST Electron" >> $env:GITHUB_STEP_SUMMARY
          "A separate Windows x64 installer, pointing only to test.nikabusiness.com." >> $env:GITHUB_STEP_SUMMARY
          "Its install identity, storage and receipt settings are independent from production." >> $env:GITHUB_STEP_SUMMARY
          "Download the **NikaBusiness-Electron-TEST-Windows** artifact from this workflow run." >> $env:GITHUB_STEP_SUMMARY
