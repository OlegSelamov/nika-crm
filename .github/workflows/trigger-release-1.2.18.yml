name: Trigger Nika Business 1.2.18

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/trigger-release-1.2.18.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Start release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-apps.yml --repo "${{ github.repository }}" -f version=1.2.18
