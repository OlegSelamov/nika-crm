name: Build Nika Apps

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.2.1"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: nika-app-release
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows app
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}".Trim()
          } else {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') { throw "Invalid version: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Set app version
        working-directory: desktop
        shell: pwsh
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: Install dependencies
        working-directory: desktop
        run: npm ci
      - name: Build installer
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build
      - name: Verify update files
        shell: pwsh
        run: |
          if (!(Test-Path "desktop/dist/NikaBusinessSetup.exe")) { throw "NikaBusinessSetup.exe was not created" }
          if (!(Test-Path "desktop/dist/latest.yml")) { throw "latest.yml was not created" }
      - name: Collect Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-files | Out-Null
          Copy-Item desktop/dist/NikaBusinessSetup.exe release-files/
          Copy-Item desktop/dist/latest.yml release-files/
          Get-ChildItem desktop/dist -Filter "*.blockmap" | Copy-Item -Destination release-files/
          Set-Content -Path release-files/version.txt -Value "${{ steps.version.outputs.version }}" -NoNewline
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: nika-windows
          path: release-files/*
          if-no-files-found: error

  windows_legacy:
    name: Build Windows 8.1 app
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: desktop/legacy/package-lock.json
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}".Trim()
          } else {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') { throw "Invalid version: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Prepare Legacy source
        shell: pwsh
        run: |
          Copy-Item desktop/main.js desktop/legacy/main.js -Force
          Copy-Item desktop/preload.js desktop/legacy/preload.js -Force
          Copy-Item desktop/icon.ico desktop/legacy/icon.ico -Force
      - name: Set app version
        working-directory: desktop/legacy
        shell: pwsh
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: Install dependencies
        working-directory: desktop/legacy
        run: npm ci
      - name: Build Windows 8.1 installer
        working-directory: desktop/legacy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build
      - name: Verify Legacy update files
        shell: pwsh
        run: |
          if (!(Test-Path "desktop/legacy/dist/NikaBusiness-Windows-8.1-Setup.exe")) { throw "Legacy installer was not created" }
          if (!(Test-Path "desktop/legacy/dist/legacy.yml")) { throw "legacy.yml was not created" }
      - name: Collect Windows 8.1 release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path legacy-release-files | Out-Null
          Copy-Item desktop/legacy/dist/NikaBusiness-Windows-8.1-Setup.exe legacy-release-files/
          Copy-Item desktop/legacy/dist/legacy.yml legacy-release-files/
          Get-ChildItem desktop/legacy/dist -Filter "*.blockmap" | Copy-Item -Destination legacy-release-files/
      - name: Upload Windows 8.1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: nika-windows-legacy
          path: legacy-release-files/*
          if-no-files-found: error

  android:
    name: Build Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="\${GITHUB_REF_NAME#v}"
          fi
          VERSION="$(printf '%s' "$VERSION" | tr -d '[:space:]')"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "Invalid version: $VERSION"
            exit 1
          fi
          BUILD_NUMBER="$(( $(date -u +%s) / 60 ))"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_B64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Android signing secrets are missing."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > android_app/android/app/nika-release.jks
          cat > android_app/android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=nika-release.jks
          EOF
      - name: Get Flutter dependencies
        working-directory: android_app
        run: flutter pub get
      - name: Build signed APK
        working-directory: android_app
        run: flutter build apk --release --build-name "${{ steps.version.outputs.version }}" --build-number "${{ steps.version.outputs.build_number }}"
      - name: Collect Android release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-release
          cp android_app/build/app/outputs/flutter-apk/app-release.apk android-release/NikaBusiness.apk
          printf '%s' "${{ steps.version.outputs.version }}" > android-release/android-version.txt
          sha256sum android-release/NikaBusiness.apk > android-release/NikaBusiness.apk.sha256
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: nika-android
          path: android-release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [windows, windows_legacy, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: nika-windows
          path: release-files
      - name: Download Android build
        uses: actions/download-artifact@v4
        with:
          name: nika-android
          path: android-release
      - name: Download Windows 8.1 build
        uses: actions/download-artifact@v4
        with:
          name: nika-windows-legacy
          path: legacy-release-files
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat release-files/version.txt)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "${{ github.sha }}" --title "Nika Business $VERSION" --notes "Автоматическая сборка Nika Business $VERSION."
          fi
          gh release upload "$TAG" release-files/NikaBusinessSetup.exe release-files/latest.yml release-files/*.blockmap legacy-release-files/NikaBusiness-Windows-8.1-Setup.exe legacy-release-files/legacy.yml legacy-release-files/*.blockmap android-release/NikaBusiness.apk android-release/NikaBusiness.apk.sha256 --clobber
      - name: Summary
        shell: bash
        run: |
          echo "### Nika Business ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Windows installer + Windows 8.1 Legacy installer + Android APK published to GitHub Releases." >> "$GITHUB_STEP_SUMMARY"
