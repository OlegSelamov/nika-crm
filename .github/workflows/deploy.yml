name: Deploy Nika Business

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: nika-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if printf '%s' "$VPS_SSH_KEY_B64" | grep -q 'BEGIN OPENSSH PRIVATE KEY'; then
            printf '%s\n' "$VPS_SSH_KEY_B64" > ~/.ssh/nika_deploy
          else
            CLEAN_KEY="$(printf '%s' "$VPS_SSH_KEY_B64" | tr -d '[:space:]')"
            if ! printf '%s' "$CLEAN_KEY" | base64 --decode > ~/.ssh/nika_deploy 2>/dev/null; then
              printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/nika_deploy
            fi
          fi
          chmod 600 ~/.ssh/nika_deploy
          if ! grep -q "BEGIN OPENSSH PRIVATE KEY\|BEGIN RSA PRIVATE KEY" ~/.ssh/nika_deploy; then
            echo "ERROR: VPS_SSH_KEY_B64 does not contain a private SSH key."
            echo "Encode the private file ~/.ssh/nika_github_deploy, NOT ~/.ssh/nika_github_deploy.pub"
            exit 1
          fi
          if ! ssh-keygen -y -f ~/.ssh/nika_deploy >/dev/null 2>&1; then
            echo "ERROR: decoded SSH private key is malformed or incomplete."
            exit 1
          fi
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/nika_deploy \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" <<'REMOTE'
          set -euo pipefail

          cd /home/ubuntu/nika-crm

          echo "Current commit:"
          git rev-parse --short HEAD

          PREVIOUS_COMMIT="$(git rev-parse HEAD)"
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "ERROR: unexpected production code changes; deploy blocked."
            git status --short
            exit 1
          fi

          # Mandatory production DB backup before changing application code.
          # Connection details stay on the production VPS.
          test -x venv/bin/python
          command -v pg_dump >/dev/null
          command -v pg_restore >/dev/null
          BACKUP_DIR="/home/ubuntu/nika-crm-backups"
          umask 077
          mkdir -p "$BACKUP_DIR"
          chmod 700 "$BACKUP_DIR"
          BACKUP_FILE="$BACKUP_DIR/pre-deploy-$(date +%Y%m%d-%H%M%S)-$.dump"
          eval "$(venv/bin/python - <<'PY'
          import os, shlex
          from dotenv import dotenv_values
          from urllib.parse import urlsplit, unquote
          url = dotenv_values(".env").get("DATABASE_URL") or os.environ.get("DATABASE_URL")
          if not url:
              raise SystemExit("ERROR: production DATABASE_URL is missing")
          parsed = urlsplit(url)
          if parsed.scheme not in ("postgres", "postgresql") or not parsed.hostname:
              raise SystemExit("ERROR: unsupported production DATABASE_URL")
          fields = {
              "PGHOST": parsed.hostname,
              "PGPORT": str(parsed.port or 5432),
              "PGUSER": unquote(parsed.username or ""),
              "PGPASSWORD": unquote(parsed.password or ""),
              "PGDATABASE": unquote(parsed.path.lstrip("/")),
          }
          for name, value in fields.items():
              print("export " + name + "=" + shlex.quote(value))
          PY
          )"
          echo "Backing up production PostgreSQL database..."
          if ! pg_dump --format=custom --no-owner --no-privileges --file="$BACKUP_FILE"; then
            rm -f "$BACKUP_FILE"
            echo "ERROR: backup failed; deployment cancelled."
            exit 1
          fi
          if ! test -s "$BACKUP_FILE" || ! pg_restore --list "$BACKUP_FILE" >/dev/null; then
            rm -f "$BACKUP_FILE"
            echo "ERROR: backup verification failed; deployment cancelled."
            exit 1
          fi
          unset PGHOST PGPORT PGUSER PGPASSWORD PGDATABASE
          echo "Verified production backup: $BACKUP_FILE"

          DEPLOY_STARTED=0
          rollback_on_exit() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ] && [ "$DEPLOY_STARTED" -eq 1 ]; then
              echo "Production deployment failed; restoring prior code..."
              git reset --hard "$PREVIOUS_COMMIT" || true
              sudo systemctl restart nika-crm || true
              echo "Prior application version restart attempted."
              echo "Database backup preserved: $BACKUP_FILE"
            fi
            exit "$status"
          }
          trap rollback_on_exit EXIT

          git fetch origin main
          DEPLOY_STARTED=1
          git checkout main
          git reset --hard origin/main

          if [ -f requirements.txt ]; then
            source venv/bin/activate
            pip install -r requirements.txt --quiet
          fi

          echo "Checking Python syntax before restart..."
          python -m py_compile app.py routes/settings.py services/alatau_client.py

          # ESF/Bank integrations may legitimately keep a worker waiting for an
          # upstream government/bank service longer than Gunicorn's 30s default.
          # Keep the origin alive long enough for the app request to finish.
          sudo mkdir -p /etc/systemd/system/nika-crm.service.d
          printf '%s\n' \
            '[Service]' \
            'Environment="GUNICORN_CMD_ARGS=--timeout 90 --graceful-timeout 30"' \
            | sudo tee /etc/systemd/system/nika-crm.service.d/20-upstream-timeouts.conf >/dev/null
          sudo systemctl daemon-reload

          # Nginx must wait longer than the ESF client timeout (60s), otherwise
          # Cloudflare sees the origin connection disappear and returns 502.
          printf '%s\n' \
            'proxy_connect_timeout 15s;' \
            'proxy_send_timeout 90s;' \
            'proxy_read_timeout 90s;' \
            | sudo tee /etc/nginx/conf.d/nika-upstream-timeouts.conf >/dev/null
          sudo nginx -t
          sudo systemctl reload nginx

          echo "nika-crm Gunicorn settings:"
          sudo systemctl show nika-crm -p ExecStart -p Environment --no-pager || true

          sudo systemctl restart nika-crm
          sleep 4

          if ! sudo systemctl is-active --quiet nika-crm; then
            echo "nika-crm service is not active"
            sudo systemctl status nika-crm --no-pager -l || true
            sudo journalctl -u nika-crm -n 120 --no-pager || true
            exit 1
          fi

          APP_PORT="$(sudo systemctl show nika-crm -p ExecStart --value | sed -n 's/.*--bind[ =][^:]*:\([0-9][0-9]*\).*/\1/p' | head -n1)"
          APP_PORT="${APP_PORT:-8000}"

          if ! curl -fsS --max-time 8 "http://127.0.0.1:${APP_PORT}/login" >/dev/null; then
            echo "nika-crm is active but HTTP health check failed on port ${APP_PORT}"
            sudo systemctl status nika-crm --no-pager -l || true
            sudo journalctl -u nika-crm -n 160 --no-pager || true
            sudo ss -ltnp || true
            exit 1
          fi

          echo "HTTP health check passed on port ${APP_PORT}"

          echo "Recent Nika service errors:"
          sudo journalctl -u nika-crm --since "20 minutes ago" --no-pager \
            | grep -E "WORKER TIMEOUT|Traceback|ERROR|Exception|Timeout|Connection" \
            | tail -n 120 || true

          echo "IS ESF outbound connectivity:"
          curl -k -sS -o /dev/null \
            --connect-timeout 8 --max-time 15 \
            -w 'HTTP=%{http_code} connect=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s\n' \
            "https://esf.gov.kz:8443/esf-web/ws/api1/AuthService" || true

          echo "Deployed commit:"
          git rev-parse --short HEAD
          REMOTE
