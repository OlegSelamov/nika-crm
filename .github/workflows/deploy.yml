name: Deploy Nika Business

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: nika-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if printf '%s' "$VPS_SSH_KEY_B64" | grep -q 'BEGIN OPENSSH PRIVATE KEY'; then
            printf '%s\n' "$VPS_SSH_KEY_B64" > ~/.ssh/nika_deploy
          else
            CLEAN_KEY="$(printf '%s' "$VPS_SSH_KEY_B64" | tr -d '[:space:]')"
            if ! printf '%s' "$CLEAN_KEY" | base64 --decode > ~/.ssh/nika_deploy 2>/dev/null; then
              printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/nika_deploy
            fi
          fi
          chmod 600 ~/.ssh/nika_deploy
          if ! grep -q "BEGIN OPENSSH PRIVATE KEY\|BEGIN RSA PRIVATE KEY" ~/.ssh/nika_deploy; then
            echo "ERROR: VPS_SSH_KEY_B64 does not contain a private SSH key."
            echo "Encode the private file ~/.ssh/nika_github_deploy, NOT ~/.ssh/nika_github_deploy.pub"
            exit 1
          fi
          if ! ssh-keygen -y -f ~/.ssh/nika_deploy >/dev/null 2>&1; then
            echo "ERROR: decoded SSH private key is malformed or incomplete."
            exit 1
          fi
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/nika_deploy \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" <<'REMOTE'
          set -euo pipefail

          cd /home/ubuntu/nika-crm

          echo "Current commit:"
          git rev-parse --short HEAD

          git fetch origin main
          git checkout main
          git reset --hard origin/main

          if [ -f requirements.txt ]; then
            source venv/bin/activate
            pip install -r requirements.txt --quiet
          fi

          sudo systemctl restart nika
          sleep 2
          sudo systemctl is-active --quiet nika

          echo "Deployed commit:"
          git rev-parse --short HEAD
          REMOTE
