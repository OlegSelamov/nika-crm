name: ISNA Android offline FNO signing checks

on:
  pull_request:
    branches: [test]
    paths:
      - 'android_app/lib/screens/isna_test_panel.dart'
      - 'android_app/android/app/src/main/kotlin/com/example/nika_business_app/KalkanJwsSigner.kt'
      - 'android_app/android/app/src/main/kotlin/com/example/nika_business_app/IsnaOfflineFnoValidator.kt'
      - 'android_app/test/isna_offline_fno_test.dart'
      - '.github/workflows/isna-android-offline-fno.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter packages
        working-directory: android_app
        run: flutter pub get
      - name: Unit checks for inert FNO
        working-directory: android_app
        run: flutter test test/isna_offline_fno_test.dart
      - name: Compile Android including Kotlin GOST validator
        working-directory: android_app
        run: flutter build apk --debug
