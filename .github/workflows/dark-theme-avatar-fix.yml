name: Payment modal dark theme fix

on:
  push:
    branches: [main]
    paths:
      - '.github/dark-theme-avatar-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Theme payment modal avatar
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android_app/lib/screens/sales_screen.dart')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'leading: const CircleAvatar(\n                          backgroundColor: AppColors.primarySoft,\n                          child: Icon(Icons.person_outline_rounded, color: AppColors.primary),\n                        ),',
              'leading: CircleAvatar(\n                          backgroundColor: Theme.of(context).colorScheme.primaryContainer,\n                          child: const Icon(Icons.person_outline_rounded, color: AppColors.primary),\n                        ),',
          )
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "Nika Business Bot"
          git config user.email "actions@users.noreply.github.com"
          git add android_app/lib/screens/sales_screen.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Theme payment modal completely"
          git push origin main
