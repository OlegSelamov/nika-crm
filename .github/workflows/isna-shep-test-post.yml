name: ISNA signed TEST WShEP transport checks

on:
  pull_request:
    branches: [test]
    paths:
      - 'services/isna_shep_transport_test.py'
      - 'routes/accounting.py'
      - 'tests/test_isna_shep_transport_test.py'
      - '.github/workflows/isna-shep-test-post.yml'
  push:
    branches: [test]
    paths:
      - 'services/isna_shep_transport_test.py'
      - 'routes/accounting.py'
      - 'tests/test_isna_shep_transport_test.py'
      - '.github/workflows/isna-shep-test-post.yml'

permissions:
  contents: read

jobs:
  test-no-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies
        run: python -m pip install --disable-pip-version-check requests python-dotenv
      - name: Syntax check
        run: python -m compileall -q routes/accounting.py services/isna_shep_transport_test.py
      - name: Tests (all gateway calls mocked)
        run: |
          python -m unittest discover -s tests -p 'test_isna_shep_transport_test.py' -v
          python -m unittest discover -s tests -p 'test_isna_signed_roundtrip.py' -v
          python -m unittest discover -s tests -p 'test_isna_fno_integration.py' -v
