name: Seed medium performance data on TEST

on:
  workflow_dispatch:

concurrency:
  group: nika-test-seed
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Configure test-only SSH
        shell: bash
        env:
          TEST_VPS_HOST: ${{ secrets.TEST_VPS_HOST }}
          TEST_VPS_SSH_KEY: ${{ secrets.TEST_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$TEST_VPS_HOST"
          test -n "$TEST_VPS_SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          python3 - <<'PY'
          import os, re, pathlib
          value = os.environ['TEST_VPS_SSH_KEY'].replace('\\n','\n').replace('\r','')
          match = re.search(r'-----BEGIN [^-\n]*PRIVATE KEY-----.*?-----END [^-\n]*PRIVATE KEY-----', value, re.S)
          if not match:
              raise SystemExit('Invalid TEST SSH key')
          (pathlib.Path.home()/'.ssh/nika_test_seed').write_text(match.group(0).strip()+'\n')
          PY
          chmod 600 ~/.ssh/nika_test_seed
          ssh-keyscan -H "$TEST_VPS_HOST" >> ~/.ssh/known_hosts

      - name: Preflight, backup, and seed isolated TEST database
        shell: bash
        env:
          TEST_VPS_HOST: ${{ secrets.TEST_VPS_HOST }}
          TEST_VPS_USER: ${{ secrets.TEST_VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/nika_test_seed -o BatchMode=yes -o ConnectTimeout=15 "${TEST_VPS_USER:-ubuntu}@$TEST_VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /var/www/nika-business-test
          test -x .venv/bin/python
          test -f scripts/seed_test_load.py
          # The checks below operate only on the TEST DB selected by .env.
          export APP_MODE=test NIKA_ALLOW_SYNTHETIC_SEED=YES
          NAME='[PERF-TEST] Нагрузочная организация MEDIUM 2026-10'
          .venv/bin/python scripts/seed_test_load.py --size medium --company-name "$NAME" --check-only
          # Refuse to create large datasets on a nearly full VPS.
          avail_kb="$(df -Pk . | awk 'NR==2 {print $4}')"
          test "$avail_kb" -ge 2097152 || { echo 'Insufficient free disk (<2 GB)'; exit 1; }
          # Require an existing backup before creating the additional data.
          # Set this path to a verified recent PostgreSQL backup on the TEST VPS.
          test -s /var/backups/nika-business-test/latest.dump || {
            echo 'TEST backup missing: /var/backups/nika-business-test/latest.dump'
            echo 'Create and verify the backup first; no data inserted.'
            exit 1
          }
          .venv/bin/python scripts/seed_test_load.py --size medium --company-name "$NAME" --skip-existing --confirm
          REMOTE
