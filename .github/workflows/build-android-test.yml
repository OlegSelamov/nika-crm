name: Build Nika Android TEST

on:
  push:
    branches:
      - test
    paths:
      - "android_app/**"
      - ".github/workflows/build-android-test.yml"
  workflow_dispatch:

permissions:
  contents: write  # publish ONLY the isolated TEST APK as a public prerelease asset

concurrency:
  group: nika-android-test
  cancel-in-progress: true

jobs:
  test-apk:
    name: Flutter tests and isolated TEST APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: android_app
        run: flutter pub get
      - name: Run Kaspi refund regression tests
        working-directory: android_app
        run: |
          flutter test test/sale_refund_confirmation_test.dart
          flutter test test/food_order_logic_test.dart
          flutter test test/organization_mode_test.dart
          flutter test test/sale_discounts_test.dart
      - name: Isolate test APK from production
        run: |
          python3 - <<'PY'
          from pathlib import Path

          api = Path("android_app/lib/services/api_service.dart")
          source = api.read_text(encoding="utf-8")
          original = "static const String baseUrl = 'https://www.nikabusiness.com';"
          assert source.count(original) == 1, "Unexpected API URL; refusing to build a production-connected test app"
          api.write_text(
              source.replace(original, "static const String baseUrl = 'https://test.nikabusiness.com';"),
              encoding="utf-8",
          )

          gradle = Path("android_app/android/app/build.gradle.kts")
          source = gradle.read_text(encoding="utf-8")
          original = "    buildTypes {\n"
          assert source.count(original) == 1, "Unexpected Gradle config"
          source = source.replace(
              original,
              '    buildTypes {\n        getByName("debug") {\n            applicationIdSuffix = ".test"\n        }\n',
          )
          gradle.write_text(source, encoding="utf-8")

          manifest = Path("android_app/android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text(encoding="utf-8")
          assert source.count('android:label="NBC"') == 1
          manifest.write_text(source.replace('android:label="NBC"', 'android:label="NBC TEST"'), encoding="utf-8")
          PY
      - name: Build isolated Android test APK
        working-directory: android_app
        run: flutter build apk --debug
      - name: Check automatic ISNA source and inert FNO UI
        working-directory: android_app
        run: |
          flutter test test/isna_auto_report_ui_test.dart
          flutter test test/isna_offline_fno_test.dart
      - name: Upload TEST APK (never a production release)
        uses: actions/upload-artifact@v4
        with:
          name: NikaBusiness-TEST-apk
          path: android_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish permanent direct TEST APK link (no main / prod release)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="nika-test-latest"
          FILE="NikaBusiness-TEST.apk"
          mkdir -p test-release
          cp android_app/build/app/outputs/flutter-apk/app-debug.apk "test-release/$FILE"
          (cd test-release && sha256sum "$FILE" > "$FILE.sha256")
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Nika Business TEST (Android)" --prerelease \
              --notes "Только тестовая сборка: отдельный package .test и API test.nikabusiness.com. Не production."
          fi
          gh release upload "$TAG" "test-release/$FILE" "test-release/$FILE.sha256" --clobber
          gh release edit "$TAG" --prerelease \
            --notes "Тестовая APK из ветки test, commit $GITHUB_SHA. API: https://test.nikabusiness.com. Не production."
          echo "### Прямая ссылка на Android TEST APK" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$FILE" >> "$GITHUB_STEP_SUMMARY"
