name: Validate Food Checkout TEST

on:
  push:
    branches:
      - test
    paths:
      - "app.py"
      - "models.py"
      - "routes/auth.py"
      - "routes/sales.py"
      - "routes/food_orders.py"
      - "routes/rekassa_comrun.py"
      - "static/js/food_sales.js"
      - "static/css/food_sales.css"
      - "templates/profile.html"
      - "templates/sales.html"
      - "tests/test_food_checkout_modes.py"
      - "tests/test_food_menu_cards.py"
      - "tests/test_food_dual_print.py"
      - "tests/test_food_ticket_layout.py"
      - "templates/food_order_ticket.html"
      - ".github/workflows/validate-food-checkout.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Food POS code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install receipt template tester
        run: python -m pip install "Jinja2>=3.1,<4"
      - name: Verify Python syntax
        run: python -m py_compile app.py models.py routes/auth.py routes/sales.py routes/food_orders.py routes/rekassa_comrun.py
      - name: Verify JavaScript syntax
        run: node --check static/js/food_sales.js
      - name: Run food checkout regression checks
        run: python -m unittest discover -s tests -p test_food_checkout_modes.py -v
      - name: Run food menu visual and scroll regression checks
        run: python -m unittest discover -s tests -p test_food_menu_cards.py -v
      - name: Run dual receipt checkout checks
        run: python -m unittest discover -s tests -p test_food_dual_print.py -v
      - name: Render and validate receipt templates
        run: python -m unittest discover -s tests -p test_food_ticket_layout.py -v
