name: nika_business_app
description: Nika Business mobile app
publish_to: "none"

version: 1.1.0+101

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.2
  shared_preferences: ^2.5.3
  intl: ^0.19.0
  mobile_scanner: ^7.0.1
  webview_flutter: ^4.13.0
  qr_flutter: ^4.1.0
  network_info_plus: ^6.1.1
  print_bluetooth_thermal: ^1.2.1
  charset_converter: ^2.3.0
  printing: 5.14.3
  file_saver: 0.4.0
  speech_to_text: ^7.4.0
  audioplayers: ^6.7.1 
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png