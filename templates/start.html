<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Начать — Nika Business</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0c0f15;color:#f5f7fb;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(620px,100%);background:#121722;border:1px solid #242b38;border-radius:24px;padding:32px}h1{margin:0 0 8px}.muted{color:#8f9bad}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f{margin-top:14px}label{display:block;font-size:12px;color:#aeb6c3;margin-bottom:6px}input{width:100%;padding:13px;border-radius:11px;border:1px solid #293141;background:#0e131c;color:#fff}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;font-weight:800}.err{margin-top:14px;padding:11px;background:#351a20;border-radius:10px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head>
<body><div class="box"><h1>Начать с Nika Business</h1><div class="muted">14 дней бесплатно. Оплата сейчас не нужна.</div>{% if error %}<div class="err">{{ error }}</div>{% endif %}<form method="post">
<div class="f"><label>Название бизнеса</label><input name="company_name" value="{{ form.company_name if form else '' }}" required></div>
<div class="grid"><div class="f"><label>Ваше имя</label><input name="full_name" value="{{ form.full_name if form else '' }}"></div><div class="f"><label>Телефон</label><input name="phone" value="{{ form.phone if form else '' }}"></div></div>
<div class="f"><label>БИН / ИИН — необязательно</label><input name="bin" value="{{ form.bin if form else '' }}"></div>
<div class="grid"><div class="f"><label>Логин</label><input name="username" value="{{ form.username if form else '' }}" required></div><div class="f"><label>Пароль</label><input type="password" name="password" required></div></div>
<button>Начать бесплатно →</button></form></div></body></html>
