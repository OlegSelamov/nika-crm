<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Корзина</title>
<style>body{margin:0;font-family:Arial,sans-serif;background:#f6f7fb;color:#111827}.wrap{max-width:820px;margin:35px auto;padding:20px}.box{background:#fff;border-radius:20px;padding:22px}.row{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #eee}.total{font-size:24px;font-weight:900;margin-top:18px}.btn{display:block;margin-top:18px;padding:13px;background:#111827;color:#fff;text-decoration:none;border-radius:11px;text-align:center;font-weight:800}</style></head>
<body><div class="wrap"><a href="/s/{{ store.slug }}">← Каталог</a><div class="box"><h1>Корзина</h1>{% for item in items %}<div class="row"><div><strong>{{ item.name }}</strong><br>{{ item.cart_qty }} × {{ item.display_price }} ₸</div><strong>{{ item.line_total }} ₸</strong></div>{% else %}<p>Корзина пуста.</p>{% endfor %}
{% if items %}<div class="total">Итого: {{ total }} ₸</div><a class="btn" href="/s/{{ store.slug }}/checkout">Оформить заказ</a>{% endif %}</div></div></body></html>
