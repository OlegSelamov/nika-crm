<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Запись</title>
<style>body{font-family:Arial,sans-serif;background:#f6f7fb;margin:0}.box{max-width:620px;margin:40px auto;background:white;padding:26px;border-radius:20px}.f{margin:12px 0}input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px}button{width:100%;padding:13px;border:0;border-radius:11px;background:#111827;color:white;font-weight:800}.err{background:#fee2e2;color:#991b1b;padding:10px;border-radius:10px}</style></head>
<body><form class="box" method="post">{% if error %}<div class="err">{{ error }}</div>{% endif %}<h1>{{ service.name }}</h1><p>{{ service.description or "" }}</p><div class="f"><input name="customer_name" placeholder="Ваше имя" required></div><div class="f"><input name="phone" placeholder="Телефон" required></div><div class="f"><input type="date" name="booking_date" required></div><div class="f"><input type="time" name="booking_time" required></div><div class="f"><textarea name="comment" placeholder="Комментарий"></textarea></div><button>Записаться</button></form></body></html>
