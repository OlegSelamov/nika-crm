<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Онлайн-запись</title><link rel="stylesheet" href="{{ url_for('static', filename='css/storefront/booking.css') }}"></head><body><div class="box"><a href="/s/{{ store.slug }}/item/{{ service.id }}">← Назад</a><h1>{{ service.name }}</h1><div class="price">{{ "{:,.0f}".format(service.retail_price or service.price or 0).replace(",", " ") }} ₸</div><p class="muted">{{ service.description or "" }}</p>{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form method="get"><div class="f"><label>Дата</label><input type="date" name="booking_date" value="{{ selected_date }}" onchange="this.form.submit()"></div></form>
<form method="post"><input type="hidden" name="booking_date" value="{{ selected_date }}"><div class="f"><label>Свободное время</label><div class="slots">{% for s in slots %}<label class="slot"><input type="radio" name="booking_time" value="{{ s }}" required><span>{{ s }}</span></label>{% else %}<p class="muted">На эту дату свободного времени нет.</p>{% endfor %}</div></div><div class="f"><input name="customer_name" placeholder="Ваше имя" required></div><div class="f"><input name="phone" placeholder="Телефон" required></div><div class="f"><textarea name="comment" placeholder="Комментарий"></textarea></div>{% if slots %}<button>Записаться</button>{% endif %}</form></div></body></html>
