<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Онлайн-запись</title><style>:root{--brand:{{ store.brand_color or '#6366f1' }};--brand-dark:color-mix(in srgb,var(--brand) 72%,#111827);--brand-soft:color-mix(in srgb,var(--brand) 12%,white);--brand-deep:color-mix(in srgb,var(--brand) 48%,#111827);}*{box-sizing:border-box}body{margin:0;background:#f5f6f9;font-family:Inter,Arial,sans-serif;color:#171b25}.box{max-width:720px;margin:35px auto;background:#fff;border:1px solid #e7eaf0;border-radius:22px;padding:26px}.price{font-size:26px;font-weight:900}.muted{color:#7b8495}.f{margin-top:14px}input,textarea{width:100%;padding:12px;border:1px solid #dfe3ea;border-radius:11px;font:inherit}.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.slot input{display:none}.slot span{display:block;text-align:center;padding:11px;border:1px solid #dfe3ea;border-radius:10px;cursor:pointer}.slot input:checked+span{background:linear-gradient(135deg,var(--brand-dark),var(--brand));color:#fff;border-color:#171b25}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--brand-dark),var(--brand));color:#fff;font-weight:850}.err{background:#fee2e2;color:#991b1b;padding:10px;border-radius:10px}@media(max-width:550px){.slots{grid-template-columns:repeat(3,1fr)}}</style></head><body><div class="box"><a href="/s/{{ store.slug }}/item/{{ service.id }}">← Назад</a><h1>{{ service.name }}</h1><div class="price">{{ "{:,.0f}".format(service.retail_price or service.price or 0).replace(",", " ") }} ₸</div><p class="muted">{{ service.description or "" }}</p>{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form method="get"><div class="f"><label>Дата</label><input type="date" name="booking_date" value="{{ selected_date }}" onchange="this.form.submit()"></div></form>
<form method="post"><input type="hidden" name="booking_date" value="{{ selected_date }}"><div class="f"><label>Свободное время</label><div class="slots">{% for s in slots %}<label class="slot"><input type="radio" name="booking_time" value="{{ s }}" required><span>{{ s }}</span></label>{% else %}<p class="muted">На эту дату свободного времени нет.</p>{% endfor %}</div></div><div class="f"><input name="customer_name" placeholder="Ваше имя" required></div><div class="f"><input name="phone" placeholder="Телефон" required></div><div class="f"><textarea name="comment" placeholder="Комментарий"></textarea></div>{% if slots %}<button>Записаться</button>{% endif %}</form></div></body></html>
