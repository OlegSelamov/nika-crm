<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Оформление заказа</title><style>:root{--brand:{{ store.brand_color or '#6366f1' }};--brand-dark:color-mix(in srgb,var(--brand) 72%,#111827);--brand-soft:color-mix(in srgb,var(--brand) 12%,white);--brand-deep:color-mix(in srgb,var(--brand) 48%,#111827);}*{box-sizing:border-box}body{margin:0;background:#f5f6f9;font-family:Inter,Arial,sans-serif}.box{max-width:650px;margin:40px auto;background:#fff;border:1px solid #e7eaf0;border-radius:22px;padding:26px}.f{margin:12px 0}input,select,textarea{width:100%;padding:13px;border:1px solid #dfe3ea;border-radius:11px;font:inherit}button{width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--brand-dark),var(--brand));color:#fff;font-weight:850}.err{padding:11px;background:#fee2e2;color:#991b1b;border-radius:10px}</style></head><body><form class="box" method="post"><h1>Оформить заказ</h1>{% if error %}<div class="err">{{ error }}</div>{% endif %}<div class="f"><input name="customer_name" placeholder="Ваше имя" required></div><div class="f"><input name="phone" placeholder="+7 777 000 00 00" required></div><div class="f"><select name="delivery_method">{% if store.pickup_enabled %}<option value="pickup">Самовывоз</option>{% endif %}{% if store.delivery_enabled %}<option value="delivery">Доставка{% if store.delivery_price %} · {{ store.delivery_price }} ₸{% endif %}</option>{% endif %}</select></div><div class="f"><input name="address" placeholder="Адрес доставки"></div><div class="f"><textarea name="comment" rows="3" placeholder="Комментарий к заказу"></textarea></div><button>Подтвердить заказ</button></form></body></html>
