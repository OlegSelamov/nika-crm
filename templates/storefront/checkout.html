<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Оформление заказа</title><link rel="stylesheet" href="{{ url_for('static', filename='css/storefront/checkout.css') }}"></head><body><form class="box" method="post"><h1>Оформить заказ</h1>{% if error %}<div class="err">{{ error }}</div>{% endif %}<div class="f"><input name="customer_name" placeholder="Ваше имя" required></div><div class="f"><input name="phone" placeholder="+7 777 000 00 00" required></div><div class="f"><select name="delivery_method">{% if store.pickup_enabled %}<option value="pickup">Самовывоз</option>{% endif %}{% if store.delivery_enabled %}<option value="delivery">Доставка{% if store.delivery_price %} · {{ store.delivery_price }} ₸{% endif %}</option>{% endif %}</select></div><div class="f"><input name="address" placeholder="Адрес доставки"></div><div class="f"><textarea name="comment" rows="3" placeholder="Комментарий к заказу"></textarea></div><button>Подтвердить заказ</button></form></body></html>
