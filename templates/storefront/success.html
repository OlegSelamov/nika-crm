<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }}</title><style>:root{--brand:{{ store.brand_color or '#6366f1' }};--brand-dark:color-mix(in srgb,var(--brand) 72%,#111827);--brand-soft:color-mix(in srgb,var(--brand) 12%,white);--brand-deep:color-mix(in srgb,var(--brand) 48%,#111827);}body{margin:0;display:grid;place-items:center;min-height:100vh;background:#f5f6f9;font-family:Inter,Arial,sans-serif}.box{max-width:520px;background:#fff;border:1px solid #e7eaf0;border-radius:24px;padding:34px;text-align:center}.ok{width:58px;height:58px;margin:auto;display:grid;place-items:center;border-radius:18px;background:#dcfce7;color:#15803d;font-size:28px;font-weight:900}.btn{display:inline-block;margin-top:17px;background:linear-gradient(135deg,var(--brand-dark),var(--brand));color:#fff;padding:12px 16px;border-radius:11px;text-decoration:none;font-weight:800}</style></head><body><div class="box"><div class="ok">✓</div><h1>{{ title }}</h1><p>{{ message }}</p><a class="btn" href="/s/{{ store.slug }}">Вернуться на витрину</a></div></body></html>
