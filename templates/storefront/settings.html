<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Онлайн-витрина</title>
<style>body{font-family:Arial,sans-serif;background:#0f172a;color:white;margin:0;padding:24px}.wrap{max-width:1000px;margin:auto}.panel{background:#182235;border:1px solid #2a3851;border-radius:20px;padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,textarea{width:100%;padding:11px;border-radius:9px;border:1px solid #334155;background:#0f172a;color:white}.checks{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0}button{padding:11px 14px;border:0;border-radius:10px;font-weight:800}.items{display:grid;gap:8px}.item{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#101827;padding:12px;border-radius:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><h1>Онлайн-витрина</h1><form class="panel" method="post"><div class="grid"><input name="slug" value="{{ settings.slug or '' }}" placeholder="Адрес: my-shop" required><input name="title" value="{{ settings.title or settings.company_name or '' }}" placeholder="Название"><textarea name="description" placeholder="Описание">{{ settings.description or '' }}</textarea><input name="whatsapp" value="{{ settings.whatsapp or '' }}" placeholder="WhatsApp"></div>
<div class="checks"><label><input type="checkbox" name="enabled" value="1" {% if settings.enabled %}checked{% endif %}> Включить витрину</label><label><input type="checkbox" name="show_products" value="1" {% if settings.show_products is not false %}checked{% endif %}> Товары</label><label><input type="checkbox" name="show_services" value="1" {% if settings.show_services is not false %}checked{% endif %}> Услуги</label><label><input type="checkbox" name="allow_orders" value="1" {% if settings.allow_orders is not false %}checked{% endif %}> Заказы</label><label><input type="checkbox" name="allow_booking" value="1" {% if settings.allow_booking is not false %}checked{% endif %}> Запись</label></div><button>Сохранить</button>
{% if settings.slug %}<p>Ссылка: <a style="color:#93c5fd" target="_blank" href="/s/{{ settings.slug }}">/s/{{ settings.slug }}</a></p>{% endif %}</form>
<div class="panel"><h2>Что показывать на сайте</h2><div class="items">{% for item in items %}<form class="item" method="post" action="/storefront/item/{{ item.id }}/toggle"><div><strong>{{ item.name }}</strong><br><small>{{ item.item_type }}</small></div><input type="hidden" name="visible" value="{{ '0' if item.storefront_visible else '1' }}"><button>{{ 'Скрыть' if item.storefront_visible else 'Показать' }}</button></form>{% endfor %}</div></div></div></body></html>
