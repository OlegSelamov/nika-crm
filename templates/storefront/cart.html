<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Корзина</title><style>:root{--brand:{{ store.brand_color or '#6366f1' }};--brand-dark:color-mix(in srgb,var(--brand) 72%,#111827);--brand-soft:color-mix(in srgb,var(--brand) 12%,white);--brand-deep:color-mix(in srgb,var(--brand) 48%,#111827);}*{box-sizing:border-box}body{margin:0;background:#f5f6f9;font-family:Inter,Arial,sans-serif;color:#171b25}.wrap{max-width:950px;margin:auto;padding:24px}.box{background:#fff;border:1px solid #e7eaf0;border-radius:22px;padding:22px}.row{display:grid;grid-template-columns:70px 1fr 130px 120px;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #edf0f4}.row img{width:70px;height:70px;object-fit:cover;border-radius:12px;background:#f3f4f6}.qty{display:flex;gap:6px}.qty input{width:70px;padding:9px;border:1px solid #ddd;border-radius:9px}.qty button{padding:9px;border:0;border-radius:9px}.total{text-align:right;font-size:25px;font-weight:900;margin-top:20px}.checkout{display:block;margin-top:16px;background:linear-gradient(135deg,var(--brand-dark),var(--brand));color:#fff;padding:14px;border-radius:12px;text-align:center;text-decoration:none;font-weight:850}.remove{background:none!important;color:#ef4444}@media(max-width:650px){.row{grid-template-columns:55px 1fr}.row img{width:55px;height:55px}.qty,.line{grid-column:2}.total{text-align:left}}</style></head><body><main class="wrap"><a href="/s/{{ store.slug }}">← Каталог</a><div class="box"><h1>Корзина</h1>{% for i in items %}<div class="row">{% if i.image %}<img src="{{ i.image }}">{% else %}<div></div>{% endif %}<div><b>{{ i.name }}</b><br><small>{{ i.display_price }} ₸ / {{ i.unit or "шт." }}</small></div><form class="qty" method="post" action="/s/{{ store.slug }}/cart/update"><input type="hidden" name="item_id" value="{{ i.id }}"><input name="quantity" value="{{ i.cart_qty }}"><button>Обновить</button><button class="remove" name="remove" value="1">×</button></form><strong class="line">{{ i.line_total }} ₸</strong></div>{% else %}<p>Корзина пока пуста.</p>{% endfor %}{% if items %}<div class="total">Итого: {{ total }} ₸</div><a class="checkout" href="/s/{{ store.slug }}/checkout">Перейти к оформлению</a>{% endif %}</div></main></body></html>
