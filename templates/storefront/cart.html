<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Корзина</title><link rel="stylesheet" href="{{ url_for('static', filename='css/storefront/cart.css') }}"></head><body><main class="wrap"><a href="/s/{{ store.slug }}">← Каталог</a><div class="box"><h1>Корзина</h1>{% for i in items %}<div class="row">{% if i.image %}<img src="{{ i.image }}">{% else %}<div></div>{% endif %}<div><b>{{ i.name }}</b><br><small>{{ i.display_price }} ₸ / {{ i.unit or "шт." }}</small></div><form class="qty" method="post" action="/s/{{ store.slug }}/cart/update"><input type="hidden" name="item_id" value="{{ i.id }}"><input name="quantity" value="{{ i.cart_qty }}"><button>Обновить</button><button class="remove" name="remove" value="1">×</button></form><strong class="line">{{ i.line_total }} ₸</strong></div>{% else %}<p>Корзина пока пуста.</p>{% endfor %}{% if items %}<div class="total">Итого: {{ total }} ₸</div><a class="checkout" href="/s/{{ store.slug }}/checkout">Перейти к оформлению</a>{% endif %}</div></main></body></html>
