{% extends "base.html" %}

{% block content %}

<div class="card client-form-card">
    <div class="form-head">
        <h2>Добавить клиента</h2>
        <div class="form-subtitle">Основная информация, документы и вложения</div>
    </div>

    <form method="POST" enctype="multipart/form-data" class="client-form-grid">
	
		<div class="form-section">
			<div class="form-section-title">
				Основная информация
			</div>
		
        <div class="form-group">
            <label>Наименование ИП / Организации</label>
            <input name="company_name" placeholder="Например: ИП Айдана / ТОО Nika Business">
        </div>
		
        <div class="form-group">
            <label>ФИО</label>
            <input name="full_name" required>
        </div>
		
        <div class="form-group">
            <label>ИИН</label>
            <input name="iin" maxlength="12" placeholder="Например: 990101300123">
        </div>
		
		<div class="form-group">

			<label>Номер договора</label>

			<input
				name="contract_number"
				value="{{ client.contract_number if client else '' }}"
				placeholder="Номер договора"
			>

		</div>

		<div class="form-group">

			<label>Дата договора</label>

			<input
				type="date"
				name="contract_date"
				value="{{ client.contract_date if client else '' }}"
			>

		</div>

        <div class="form-group">
            <label>Телефон</label>
            <input name="phone">
        </div>

        <div class="form-group">
            <label>Адрес</label>
            <input name="address">
        </div>

		</div>

		<div class="form-section">

			<div class="form-section-title">
				CRM информация
			</div>
		
        <div class="form-group">
            <label>Статус</label>
            <select name="status">
                <option>Новый</option>
                <option>В работе</option>
                <option>Ожидание</option>
                <option>Завершен</option>
            </select>
        </div>

        <div class="form-group">
            <label>Категория</label>
            <select name="category">
                <option>Клиент</option>
                <option>Предприниматель</option>
                <option>Партнер</option>
                <option>Другое</option>
            </select>
        </div>

        <div class="form-group">
            <label>Оплата</label>
            <select name="payment">
                <option>Наличные</option>
                <option>Безнал</option>
                <option>Kaspi QR</option>
                <option>Не оплачено</option>
            </select>
        </div>

		</div>

		<div class="form-section">

			<div class="form-section-title">
				Файлы и вложения
			</div>
		
        <div class="form-group">
            <label>Основное фото клиента</label>
            <input type="file" name="photo" accept="image/*">
        </div>

        <div class="form-group">
            <label>Фото к комментарию</label>
            <input type="file" name="comment_photos" accept="image/*" multiple>
        </div>

        <div class="form-group full-width">
            <label>Комментарий</label>
            <textarea name="comment" rows="5"></textarea>
        </div>

		</div>
        <div class="form-actions full-width">
            <button class="btn" type="submit">Сохранить</button>
            <a href="/clients" class="btn gray">Отмена</a>
        </div>
    </form>
</div>

<style>
.client-form-card {
    max-width: 1100px;
    margin: 0 auto;
    border-radius: 22px;
}

.form-head {
    margin-bottom: 18px;
}

.form-head h2 {
    margin: 0 0 6px;
}

.form-subtitle {
    color: #6b7280;
    font-size: 14px;
}

.client-form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 18px;
}

.client-form-grid .form-group {
    margin-bottom: 0;
}

.client-form-grid .full-width {
    grid-column: 1 / -1;
}

.client-form-grid textarea {
    min-height: 120px;
    resize: vertical;
}

.form-actions {
    display: flex;
    gap: 10px;
    margin-top: 6px;
}

input[type="file"] {
    padding: 9px;
    background: white;
}

@media (max-width: 768px) {
    .client-form-grid {
        grid-template-columns: 1fr;
    }

    .client-form-grid .full-width {
        grid-column: auto;
    }
}

/* ===== SMALL PHONES ===== */

@media (max-width:420px){

	.form-head h2{
		font-size:22px;
	}

	.client-form-grid input,
	.client-form-grid select,
	.client-form-grid textarea{

		font-size:13px;
		padding:13px;
	}
}

@media (max-width:768px){

	.form-actions .btn{

		width:100% !important;

		min-width:0 !important;

		height:52px !important;

		padding:0 14px !important;

		font-size:15px !important;

		border-radius:14px !important;
	}

	.client-form-card{

		background:white;

		box-shadow:
		0 4px 18px rgba(0,0,0,.06);
	}

	.client-form-grid{

		display:flex !important;

		flex-direction:column !important;
	}
}

/* ================= FORM SECTIONS ================= */

.form-section{

	display:flex;
	flex-direction:column;

	gap:14px;

	padding:18px;

	border-radius:22px;

	background:
	linear-gradient(
	180deg,
	rgba(248,250,252,.95),
	rgba(241,245,249,.92)
	);

	border:1px solid rgba(99,102,241,.08);

	box-shadow:
	0 4px 18px rgba(15,23,42,.05);

	margin-bottom:6px;
}

.form-section-title{

	font-size:12px;
	font-weight:800;

	color:#4f46e5;

	text-transform:uppercase;

	letter-spacing:1px;

	padding-bottom:10px;

	border-bottom:
	1px solid rgba(99,102,241,.08);
}

/* MOBILE */

@media (max-width:768px){

	.client-form-grid{

		display:flex !important;
		flex-direction:column !important;

		gap:14px !important;
	}

	.form-section{

		padding:14px;

		border-radius:18px;
	}

	.form-group{

		margin:0 !important;
	}

	.form-group label{

		display:block;

		font-size:13px;
		font-weight:700;

		margin-bottom:6px;
	}

	.form-group input,
	.form-group select,
	.form-group textarea{

		width:100%;

		height:48px;

		border-radius:14px;

		padding:0 14px;

		font-size:14px;
	}

	.form-group textarea{

		height:120px;

		padding:14px;
	}

	.form-actions{

		position:sticky;

		bottom:0;

		background:white;

		padding-top:12px;

		display:grid;

		grid-template-columns:1fr 1fr;

		gap:10px;
	}

	.form-actions .btn{

		height:50px !important;

		border-radius:14px !important;
	}
}

@media (max-width:768px){

	.client-form-card{

		background: transparent !important;

		box-shadow: none !important;

		padding: 0 !important;
	}

	.client-form-grid{

		gap:16px !important;
	}

	.form-head{

		padding:0 4px;
		margin-bottom:16px;
	}
}
</style>

{% endblock %}
