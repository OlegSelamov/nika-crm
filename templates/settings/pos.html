{% extends "base.html" %}

{% block content %}

<h2>POS Терминалы</h2>

<div class="card">

    <div class="form-group">
        <label>Тип терминала</label>

        <select>
            <option>Kaspi POS</option>
            <option>Halyk POS</option>
            <option>Freedom POS</option>
            <option>Smart POS</option>
        </select>
    </div>

    <div class="form-group">
        <label>IP адрес</label>
        <input type="text" placeholder="192.168.1.100">
    </div>

    <div class="form-group">
        <label>Порт</label>
        <input type="text" placeholder="8080">
    </div>

    <button class="btn">
        Проверить подключение
    </button>

</div>

{% endblock %}
