<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ item.name }}</title>
<style>body{margin:0;font-family:Arial,sans-serif;background:#f6f7fb;color:#111827}.wrap{max-width:760px;margin:40px auto;padding:20px}.card{background:#fff;border-radius:22px;padding:28px;box-shadow:0 10px 35px rgba(0,0,0,.07)}.price{font-size:28px;font-weight:900}.muted{color:#64748b}.btn,button{display:inline-block;border:0;border-radius:11px;padding:12px 16px;background:#111827;color:#fff;text-decoration:none;font-weight:800}input{width:100px;padding:10px;border-radius:9px;border:1px solid #ddd}</style></head>
<body><div class="wrap"><a href="/s/{{ store.slug }}">← Назад</a><div class="card"><h1>{{ item.name }}</h1><p class="muted">{{ item.description or "" }}</p><div class="price">{{ "{:,.0f}".format(item.display_price or 0).replace(",", " ") }} ₸</div>
{% if item.item_type == 'service' %}
<p><a class="btn" href="/s/{{ store.slug }}/booking/{{ item.id }}">Записаться</a></p>
{% else %}
<form method="post" action="/s/{{ store.slug }}/cart/add"><input type="hidden" name="item_id" value="{{ item.id }}"><input name="quantity" value="1"><button>В корзину</button></form>
{% endif %}
</div></div></body></html>
