<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Оформление</title>
<style>body{font-family:Arial,sans-serif;background:#f6f7fb;margin:0}.box{max-width:620px;margin:40px auto;background:white;padding:26px;border-radius:20px}.f{margin:12px 0}input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px}button{width:100%;padding:13px;border:0;border-radius:11px;background:#111827;color:white;font-weight:800}.err{background:#fee2e2;color:#991b1b;padding:10px;border-radius:10px}</style></head>
<body><form class="box" method="post">{% if error %}<div class="err">{{ error }}</div>{% endif %}<h1>Оформление заказа</h1><div class="f"><input name="customer_name" placeholder="Ваше имя" required></div><div class="f"><input name="phone" placeholder="Телефон" required></div><div class="f"><select name="delivery_method"><option value="pickup">Самовывоз</option><option value="delivery">Доставка</option></select></div><div class="f"><input name="address" placeholder="Адрес доставки"></div><div class="f"><textarea name="comment" placeholder="Комментарий"></textarea></div><button>Отправить заказ</button></form></body></html>
