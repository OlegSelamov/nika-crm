{% extends "base.html" %}

{% block content %}

<div class="page">

    <h2>Приход товара</h2>

    <form method="POST" class="income-form">

        <select name="item_id" required>

            {% for item in items %}

                <option value="{{ item.id }}">
                    {{ item.name }}
                </option>

            {% endfor %}

        </select>

        <input
            type="number"
            step="0.001"
            name="quantity"
            placeholder="Количество"
            required
        >

        <input
            type="number"
            step="0.01"
            name="price"
            placeholder="Закупочная цена"
            required
        >

        <input
            type="text"
            name="comment"
            placeholder="Комментарий"
        >

        <button class="btn">
            Сохранить
        </button>

    </form>

</div>

<style>

.page{
    padding:20px;
}

.income-form{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:15px;

    max-width:800px;
}

.income-form input,
.income-form select{

    padding:12px;

    border-radius:10px;

    border:1px solid #ddd;
}

.btn{

    padding:12px;

    border:none;

    border-radius:10px;

    background:#2563eb;

    color:white;

    cursor:pointer;
}

@media (max-width:768px){

	.page{
		padding:12px;
	}

	h2{
		font-size:24px;
		margin-bottom:14px;
	}

	.income-form{

		grid-template-columns:1fr !important;

		gap:12px;

		max-width:none;
	}

	.income-form input,
	.income-form select{

		height:48px;

		font-size:14px;

		border-radius:14px;
	}

	.btn{

		height:50px;

		font-size:15px;

		font-weight:700;

		border-radius:14px;
	}
}

</style>

{% endblock %}
