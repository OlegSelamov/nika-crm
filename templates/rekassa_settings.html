{% extends "base.html" %}

{% block content %}

<h2>🧾 ReKassa</h2>

<div class="card">

    <label>ЗНМ</label>
    <input
        type="text"
        id="rekassa_number"
        value="{{ rekassa.rekassa_number or '' }}"
        placeholder="Введите ЗНМ">

    <label>Пароль интеграции</label>
    <input
        type="password"
        id="rekassa_password"
        placeholder="{{ 'Введите новый пароль, если хотите изменить' if rekassa.rekassa_enabled else 'Введите пароль' }}">

    <br><br>

    <button class="btn" onclick="checkRekassa()">
        Проверить подключение
    </button>

    <button class="btn" onclick="saveRekassa()">
        Сохранить
    </button>

    <div id="rekassaStatus">
      {% if rekassa.rekassa_enabled %}
      <div style="color:green;margin-top:12px">
        ✅ reKassa сохранена<br>
        ЗНМ: {{ rekassa.rekassa_serial_number or rekassa.rekassa_number or '—' }}<br>
        ID: {{ rekassa.rekassa_crs_id or '—' }}
      </div>
      {% endif %}
    </div>

</div>

<script>

async function checkRekassa(){

    const number =
        document.getElementById("rekassa_number").value;

    const password =
        document.getElementById("rekassa_password").value;

    const response = await fetch(
        "/api/rekassa/login",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                number:number,
                password:password
            })
        }
    );

    const result = await response.json();

    console.log(result);

	if(result.id){

		document.getElementById(
			"rekassaStatus"
		).innerHTML = `
			<div style="color:green">
				✅ Подключено<br>
				ЗНМ: ${result.serialNumber}<br>
				ID: ${result.id}
			</div>
		`;

	}else{

        document.getElementById(
            "rekassaStatus"
        ).innerHTML = `
            <div style="color:red">
                ❌ Ошибка подключения
            </div>
        `;
    }
}

async function saveRekassa(){

    const number =
        document.getElementById("rekassa_number").value;

    const password =
        document.getElementById("rekassa_password").value;

    const response = await fetch(
        "/api/rekassa/login",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                number,
                password
            })
        }
    );

    const auth = await response.json();

    if(!auth.id){
        alert("Сначала проверьте подключение");
        return;
    }

    const saveResponse = await fetch(
        "/api/rekassa/save",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                number:number,
                password:password,
                id:auth.id,
                serialNumber:auth.serialNumber
            })
        }
    );

    const saved = await saveResponse.json().catch(() => ({}));

    if(!saveResponse.ok || saved.success !== true){
        alert(saved.error || "Не удалось сохранить reKassa");
        return;
    }

    document.getElementById("rekassaStatus").innerHTML = `
      <div style="color:green;margin-top:12px">
        ✅ reKassa сохранена<br>
        ЗНМ: ${saved.serial_number || number}<br>
        ID: ${saved.crs_id || auth.id}
      </div>
    `;

    alert("reKassa сохранена");
}

</script>

{% endblock %}
