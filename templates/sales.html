<script>
let cart = [];
let selectedClientData = null;
let selectedClient = null;
let currentBarcodeData = {};

let company = {}; // 👈 вот сюда

fetch("/api/company/active")
.then(res => res.json())
.then(data => {
    company = data;
});

function loadItems() {

// загрузка товаров
fetch("/api/items")
.then(res => res.json())
.then(data => {
    let html = "";

    data.forEach(i => {
        html += `
            <div class="item-card" onclick="addToCart(${i.id}, '${i.name}', ${i.retail_price || 0}, 1, '${i.gtin || ""}', '${i.ntin || ""}')">

                <div class="item-image">
                    <img src="${i.image || '/static/img/no-image.png'}">

                    ${i.discount_percent ? `
                        <div class="discount-badge">-${i.discount_percent}%</div>
                    ` : ""}
                </div>

                <div class="item-info">

                    <div class="item-name">
                        ${i.name}
                    </div>

                    <div class="item-price-block">

                        ${i.old_price ? `
                            <div class="old-price">${i.old_price} ₸</div>
                        ` : ""}

                        <div class="new-price">
                            ${i.retail_price || 0} ₸
                        </div>

                    </div>

                </div>

            </div>
        `;
    });

    document.getElementById("itemsList").innerHTML = html;
});

}

// добавление в корзину
function addToCart(id, name, price, qty = 1, gtin = "", ntin = "") {

    const existing = cart.find(i => i.id === id);

    if (existing) {
        existing.qty += 1;
    } else {
		cart.push({
			id,
			name,
			price,
			qty,
			gtin,
			ntin
		});
    }

    renderCart();
	document.getElementById("itemsList").style.display = "none";
    document.getElementById("search").value = "";
}

// отрисовка корзины
function renderCart() {
    let html = "";
    let total = 0;

    cart.forEach((item, index) => {
        let qty = item.qty || 1;
        let sum = item.price * qty;

        total += sum;

        html += `
            <tr>
                <td>${item.name}</td>
                <td>
                    <button type="button" onclick="changeQty(${index}, -1)">-</button>
                    ${qty}
                    <button type="button" onclick="changeQty(${index}, 1)">+</button>
                </td>
                <td>${sum} тг</td>
                <td>
                    <button type="button" onclick="removeItem(${index})">❌</button>
                </td>
            </tr>
        `;
    });

    document.getElementById("cart").innerHTML = html;
	    renderMobileCart();
	document.getElementById("totalAmount").innerText =
		total.toLocaleString("ru-RU") + " ₸";
}

function renderMobileCart() {

	let html = "";

	cart.forEach((item, index) => {

		let qty = item.qty || 1;
		let sum = item.price * qty;

		html += `
			<div class="mobile-cart-item">

				<div class="mobile-cart-top">

					<div class="mobile-cart-name">
						${item.name}
					</div>

					<div class="mobile-cart-price">
						${sum} ₸
					</div>

				</div>

				<div class="mobile-cart-bottom">

					<div class="mobile-qty">
						<button onclick="changeQty(${index}, -1)">−</button>
						<span>${qty}</span>
						<button onclick="changeQty(${index}, 1)">+</button>
					</div>

					<button onclick="removeItem(${index})">
						❌
					</button>

				</div>

			</div>
		`;
	});

	let mobile = document.getElementById("mobileCart");

	if (mobile) {
		mobile.innerHTML = html;
	}
}

function changeQty(index, delta) {
    cart[index].qty = (cart[index].qty || 1) + delta;

    if (cart[index].qty <= 0) {
        cart.splice(index, 1);
    }

    renderCart();
}

function removeItem(i) {
    cart.splice(i, 1);
    renderCart();
}

// оплата
function pay() {

    if (!selectedClient) {
        alert("Сначала выбери клиента");
        return;
    }

    let cash = document.getElementById("cashInput").value || 0;
    let card = document.getElementById("cardInput").value || 0;
    let kaspi = document.getElementById("kaspiInput").value || 0;

    fetch("/sales/pay", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            client_id: selectedClient,
            cart: cart,
            cash: cash,
            card: card,
            kaspi: kaspi,
            company_id: null
        })
    })
    .then(res => res.json().catch(() => null))
    .then(data => {

        if (!data) {
            alert("Ошибка ответа сервера");
            return;
        }

        openSaleModal(data.sale_id);

        cart = [];
        renderCart();

    })
    .catch(err => {
        console.error("PAY ERROR:", err);
    });
}

document.getElementById(
    "itemsList"
).style.display = "grid";

function searchItems(query) {
    fetch("/api/items")
    .then(res => res.json())
    .then(data => {
        let html = "";

        data.forEach(i => {
            if (
                i.name.toLowerCase().includes(query.toLowerCase()) ||
                (i.barcode && i.barcode.includes(query))
            ) {
				html += `
					<div class="item-card" onclick="addToCart(${i.id}, '${i.name}', ${i.retail_price || 0}, 1, '${i.gtin || ""}', '${i.ntin || ""}')">

						<div class="item-image">
							<img src="${i.image || '/static/img/no-image.png'}">
							
							${i.discount_percent ? `
								<div class="discount-badge">-${i.discount_percent}%</div>
							` : ""}
						</div>

						<div class="item-info">

							<div class="item-name">
								${i.name}
							</div>

							<div class="item-price-block">

								${i.old_price ? `
									<div class="old-price">${i.old_price} ₸</div>
								` : ""}

								<div class="new-price">
									${i.retail_price || 0} ₸
								</div>

							</div>

						</div>

					</div>
				`;
            }
        });

        document.getElementById("itemsList").innerHTML = html;
        document.getElementById("itemsList").style.display = "block";
    });
}

// шторка выбора клиента
function openClientSheet() {
    document.getElementById("clientSheet").classList.add("active");
    loadClients();
}

function closeClientSheet() {
    document.getElementById("clientSheet").classList.remove("active");
}

function loadClients() {

    fetch("/api/clients")
    .then(res => res.json())
    .then(data => {

        let html = "<div class='table-wrapper'><table class='client-table'>";

        data.forEach(c => {

            const company = c.company_name || "Без компании";
            const name = c.full_name || "";

            html += `
                <tr onclick='selectClient(${JSON.stringify(c)})'>
                    <td>
                        <div style="display:flex; justify-content:space-between;">
                            
                            <span style="font-weight:600;">
                                ${company}
                            </span>

                            <span style="color:#64748b;">
                                ${name}
                            </span>

                        </div>

                        <div style="font-size:12px; color:#94a3b8;">
                            ${c.phone || ""}
                        </div>
                    </td>
                </tr>
            `;
        });

        html += "</table></div>";

        document.getElementById("clientList").innerHTML = html;
		
    });
}

function filterClients() {
    const input = document.getElementById("clientSearchInput");
    const query = input.value.toLowerCase().trim();

    const rows = document.querySelectorAll("#clientList tr");

    rows.forEach(row => {

        // 🔥 берем ТОЛЬКО текст без HTML
        const text = row.textContent.toLowerCase();

        if (text.includes(query)) {
            row.style.display = "";
        } else {
            row.style.display = "none";
        }

    });
}

function selectClient(client) {

    selectedClientData = client;

    document.getElementById("selectedClient").innerHTML = `
        <b>${client.company_name || ""}</b><br>
        ${client.full_name || ""}<br>
        📞 ${client.phone || ""}<br>
        🆔 ${client.iin || ""}<br>
        📍 ${client.address || ""}
    `;
}

function confirmClient() {

    if (!selectedClientData) {
        alert("Выберите клиента");
        return;
    }

    selectedClient = selectedClientData.id;

    document.getElementById("clientSearch").value = selectedClientData.full_name;

    closeClientSheet();
}

const searchInput = document.getElementById("search");
const itemsBox = document.getElementById("itemsList");

if (searchInput) {

    searchInput.addEventListener("input", function () {

        const query = this.value.toLowerCase().trim();

        if (!query) {
            itemsBox.style.display = "none";
            return;
        }

        itemsBox.style.display = "grid";

        let hasVisible = false;

        document.querySelectorAll("#itemsList .item-card").forEach(el => {

            const text = el.innerText.toLowerCase();
            const match = text.includes(query);

            el.style.display = match ? "" : "none";

            if (match) hasVisible = true;
        });

		if (hasVisible) {

			itemsBox.style.display = "grid";

		} else {

			itemsBox.style.display = "none";

		}
    });

    // 🔥 клик вне — закрывает
    document.addEventListener("click", function(e) {
        if (!e.target.closest(".search-box")) {
            itemsBox.style.display = "none";
        }
    });
}

function fillPayment(type) {

    let total = parseInt(document.getElementById("totalAmount").innerText.replace(/\D/g, ""));

    let cash = parseInt(document.getElementById("cashInput").value || 0);
    let card = parseInt(document.getElementById("cardInput").value || 0);
    let kaspi = parseInt(document.getElementById("kaspiInput").value || 0);

    let currentSum = cash + card + kaspi;

    let remaining = total - currentSum;

    if (remaining <= 0) {
        return;
    }

    if (type === "cash") {
        document.getElementById("cashInput").value = cash + remaining;
    }

    if (type === "card") {
        document.getElementById("cardInput").value = card + remaining;
    }

    if (type === "kaspi") {
        document.getElementById("kaspiInput").value = kaspi + remaining;
    }
}

function sendAssistant(text) {

    fetch("/api/agent/command", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            text: text
        })
    })
    .then(res => res.json())
    .then(data => {

        console.log("ASSISTANT:", data);

        // 👉 если есть ответ (диалог)
        if (data.reply) {
            alert(data.reply); // пока просто
            return;
        }

        // 👉 если успех
        if (data.success) {
            alert(data.message || "Готово");
            location.reload();
            return;
        }

    });
}

function openSaleModal(id) {

    const modal = document.getElementById("saleModal");
    const body = document.getElementById("saleBody");
	document.getElementById("saleTitle").dataset.saleId = id;

    if (!modal || !body) {
        console.error("Модалка не найдена");
        return;
    }

    modal.style.display = "flex";
    body.innerHTML = "Загрузка...";

    fetch("/api/sale/" + id)
		.then(() => {

			fetch("/docs/check/" + id)

			.then(res => res.text())

			.then(html => {

				body.innerHTML = html;

			});

		})
		
        .catch(err => {
            console.error("SALE LOAD ERROR:", err);
            body.innerHTML = "Ошибка загрузки чека";
        });
}

function closeSaleModal() {
    document.getElementById("saleModal").style.display = "none";
}

function formatDate(dateStr) {

    if (!dateStr) return "";

    const date = new Date(dateStr);

    const day = String(date.getDate()).padStart(2, "0");
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const year = date.getFullYear();

    const hours = String(date.getHours()).padStart(2, "0");
    const minutes = String(date.getMinutes()).padStart(2, "0");

    return `${day}.${month}.${year}, ${hours}:${minutes}`;
}

function printCheck() {

    const printContents =
        document.getElementById(
            "saleBody"
        ).innerHTML;

    const original =
        document.body.innerHTML;

    document.body.innerHTML = `
        <div style="
            width:58mm;
            margin:0 auto;
            font-family:Arial;
            font-size:13px;
        ">
            ${printContents}
        </div>
    `;

    window.print();

    document.body.innerHTML = original;

    location.reload();
}

function downloadPDF() {

    const element = document.getElementById("saleBody");

    // 🔥 делаем чек узким и центрируем
    element.style.width = "302px";
    element.style.margin = "0 auto";
    element.style.fontFamily = "Courier New, monospace";
    element.style.fontSize = "12px";
    element.style.display = "block";

    const opt = {
        margin: 0, // 🔥 убираем боковые отступы
        filename: 'check.pdf',
        image: { type: 'jpeg', quality: 1 },
        html2canvas: { 
            scale: 2,
            useCORS: true
        },
        jsPDF: {
            unit: 'mm',
            format: [80, 200],
            orientation: 'portrait'
        }
    };

    html2pdf().set(opt).from(element).save().then(() => {

        // возвращаем как было
        element.style.width = "";
        element.style.margin = "";
        element.style.fontFamily = "";
        element.style.fontSize = "";
        element.style.display = "";

    });
}

function createInvoiceSale() {

    if (!selectedClient) {
        alert("Сначала выбери клиента");
        return;
    }

    fetch("/sales/create-invoice", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            client_id: selectedClient,
            cart: cart,
        })
    })
    .then(res => res.json())
    .then(data => {

        if (!data.success) {
            alert("Ошибка");
            return;
        }

        // 🔥 открываем счет
        window.open(`/docs/invoice/${data.sale_id}`, "_blank");

        // очищаем
        cart = [];
        renderCart();

    });
}

let codeReader = null;
let selectedDeviceId = null;

async function openScanner() {

    const readerEl = document.getElementById("reader");
    document.getElementById("scannerModal").style.display = "flex";

    // 🔥 очищаем
    readerEl.innerHTML = "";

    // 🔥 создаём видео вручную
    const video = document.createElement("video");
    video.setAttribute("autoplay", true);
    video.setAttribute("playsinline", true);
    video.style.width = "100%";
    video.style.height = "auto";

    readerEl.appendChild(video);

    try {

        // 🔥 ВКЛЮЧАЕМ КАМЕРУ НАПРЯМУЮ
		const stream = await navigator.mediaDevices.getUserMedia({

			video: {

				facingMode: { ideal: "environment" },

				width: { ideal: 1920 },
				height: { ideal: 1080 }

			}

		});

        video.srcObject = stream;
		
		const track =
			stream.getVideoTracks()[0];

		const capabilities =
			track.getCapabilities();

		// 🔥 автофокус
		if (capabilities.focusMode) {

			track.applyConstraints({
				advanced: [
					{
						focusMode: "continuous"
					}
				]
			});
		}

		// 🔥 zoom
		if (capabilities.zoom) {

			track.applyConstraints({
				advanced: [
					{
						zoom:
							capabilities.zoom.max / 2
					}
				]
			});
		}

        // 🔥 ждём пока реально появится картинка
        await video.play();

		// 🔥 НАТИВНЫЙ СКАНЕР БРАУЗЕРА — вместо ZXing
		if (!("BarcodeDetector" in window)) {
			alert("Этот браузер не поддерживает быстрый сканер. Попробуй Chrome на Android.");
			return;
		}

		const barcodeDetector = new BarcodeDetector({
			formats: [
				"ean_13",
				"ean_8",
				"code_128",
				"code_39",
				"upc_a",
				"upc_e"
			]
		});

		let lastDetectedCode = "";
		let lastDetectedTime = 0;

		async function scanFrame() {
			try {
				const barcodes = await barcodeDetector.detect(video);

				if (barcodes.length > 0) {
					const code = barcodes[0].rawValue;
					const now = Date.now();

					if (code.length >= 8 && code.length <= 14) {

						// защита от дублей
						if (!(code === lastDetectedCode && now - lastDetectedTime < 1200)) {

							lastDetectedCode = code;
							lastDetectedTime = now;

							console.log("BARCODE DETECTOR:", code);

							const beep = document.getElementById("beepSound");
							if (beep) {
								beep.currentTime = 0;
								beep.play().catch(() => {});
							}

							if (navigator.vibrate) {
								navigator.vibrate(120);
							}

							fetch("/api/scan", {
								method: "POST",
								headers: {"Content-Type": "application/json"},
								body: JSON.stringify({ code: code })
							});
						}
					}
				}
			} catch (err) {
				console.log("SCAN FRAME ERROR:", err);
			}

			requestAnimationFrame(scanFrame);
		}

        scanFrame();

    } catch (err) {

        console.error("CAMERA ERROR:", err);
        alert("Не удалось запустить камеру");

    }
}

function handleBarcode(code) {

    fetch("/api/barcode", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            barcode: code
        })
    })

    .then(res => res.json())

    .then(data => {

        // ✅ нашли товар
        if (data.found) {

            // 🔥 ВЕСОВОЙ ТОВАР
            if (
                data.unit === "кг" ||
                data.unit === "литр"
            ) {

                const qty = prompt(
                    "Введите количество"
                );

                if (!qty) return;

				addToCart(
					data.id,
					data.name,
					data.price,
					parseFloat(qty),
					data.gtin || "",
					data.ntin || ""
				);

            } else {

				addToCart(
					data.id,
					data.name,
					data.price,
					1,
					data.gtin || "",
					data.ntin || ""
				);
            }

        }

        // ❌ нет товара
        else {

            openAddItemModal(code);

        }

    });

}

let barcodeBuffer = "";
let lastKeyTime = 0;

document.addEventListener("keydown", function(e) {

    const now = Date.now();

    // 🔥 если пауза большая — новый скан
    if (now - lastKeyTime > 100) {
        barcodeBuffer = "";
    }

    lastKeyTime = now;

    // 🔥 если нажали Enter → код готов
    if (e.key === "Enter") {

        if (barcodeBuffer.length >= 8) {

            console.log("USB Скан:", barcodeBuffer);

            // 🔊 пик
            const beep = document.getElementById("beepSound");
            if (beep) {
                beep.currentTime = 0;
                beep.play().catch(() => {});
            }

            handleBarcode(barcodeBuffer);
        }

        barcodeBuffer = "";
        return;
    }

    // 🔥 только цифры
    if (/[0-9]/.test(e.key)) {
        barcodeBuffer += e.key;
    }
});

function startListening(autoClose = false) {

    const interval = setInterval(() => {

        if (!sessionId) return;

        fetch("/api/get-scan/" + sessionId)
        .then(res => res.json())
        .then(data => {

            if (data.code) {

                handleBarcode(data.code);

                // 🔥 закрываем QR
                if (autoClose) {
                    document.getElementById("qrBox").style.display = "none";
                }

            }

        });

    }, 200);

}
