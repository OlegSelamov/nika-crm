{% extends "base.html" %}

{% block content %}

<h2>Добавить позицию</h2>

<form method="POST" enctype="multipart/form-data">
<div class="item-grid">

<!-- 🔥 НАЗВАНИЕ -->
<input 
    name="name" 
    list="itemsList"
    value="{{ item.name if item else '' }}"
    placeholder="Название"
>

<!-- 🔥 СПИСОК С ДАННЫМИ -->
<datalist id="itemsList">
    {% for i in items %}
        <option 
            value="{{ i.name }}"
            data-price="{{ i.retail_price }}"
            data-category="{{ i.category }}"
            data-description="{{ i.description }}"
        >
    {% endfor %}
</datalist>

<div class="category-wrapper">

    <input
        type="text"
        name="category"
        id="categoryInput"
        placeholder="Категория"
        autocomplete="off"
        value="{{ item.category if item else '' }}"
    >

    <div id="categoryDropdown" class="category-dropdown">

        {% for c in categories %}

        <div
            class="category-option"
            onclick="selectCategory('{{ c['name'] }}', '{{ c['markup_percent'] }}')"
        >

            <div>
                <b>{{ c['name'] }}</b>
                <span class="markup">
                    {{ c['markup_percent'] }}%
                </span>
            </div>

            <button
                type="button"
                class="delete-category"
                onclick="deleteCategory(event, {{ c['id'] }})"
            >
                🗑
            </button>

        </div>

        {% endfor %}

    </div>

</div>

<button type="button" class="btn" id="openCategoryModal">
    + Категория
</button>

<div id="categoryModal" class="modal">

    <div class="modal-content">

        <h3>Добавить категорию</h3>

        <input
            type="text"
            id="newCategoryName"
            placeholder="Название категории"
        >

        <input
            type="number"
            id="newCategoryMarkup"
            placeholder="Наценка %"
        >

        <button type="button" id="saveCategoryBtn">
            Сохранить
        </button>

    </div>

</div>

<!-- 🔥 ЕД.ИЗМ. -->
<select name="unit" id="unitSelect">

    <option value="шт">шт</option>
    <option value="услуга">услуга</option>
    <option value="час">час</option>
    <option value="день">день</option>
    <option value="ночь">ночь</option>
    <option value="тур">тур</option>
    <option value="кг">кг</option>
    <option value="литр">литр</option>
    <option value="м²">м²</option>
    <option value="м³">м³</option>
    <option value="комплект">комплект</option>
    <option value="человек">человек</option>
    <option value="пассажир">пассажир</option>
    <option value="месяц">месяц</option>

</select>

<!-- 🔥 ОПИСАНИЕ -->
<textarea
    class="full"
    name="description" 
    placeholder="Опишите товар / услугу"
>{{ item.description if item else '' }}</textarea>

<!-- 🔥 ЦЕНЫ -->
<input name="retail_price" id="retail_price" value="{{ item.retail_price if item else '' }}" placeholder="Цена розница">

<input name="wholesale_price" value="{{ item.wholesale_price if item else '' }}" placeholder="Цена опт">

<input name="purchase_price" id="purchase_price" value="{{ item.purchase_price if item else '' }}" placeholder="Цена закупа">

<input name="discount_percent" value="{{ item.discount_percent if item else '' }}" placeholder="Скидка %">

<input
    type="number"
    step="0.001"
    name="quantity"
    value="{{ item.quantity if item else '' }}"
    placeholder="Остаток"
>

<div class="barcode-row">

    <input
        type="text"
        name="barcode"
        id="barcodeInput"
        value="{{ item.barcode if item else '' }}"
        placeholder="Штрихкод"
        autocomplete="off"
    >

    <button
        type="button"
        onclick="openScanner()"
        class="scan-btn"
    >
        📷
    </button>

    <button
        type="button"
        onclick="showQR()"
        class="scan-btn"
    >
        📡
    </button>

</div>

<div class="full">
    <label>Фото:</label>
    <input type="file" name="images" multiple>
</div>

</div>
    <button class="btn">Сохранить</button>

<div id="scannerModal" class="scanner-modal">
	
    <div class="scanner-box">

        <div id="reader"></div>

        <button onclick="closeScanner()" class="btn">Закрыть</button>

    </div>
</div>

<div id="qrBox" style="
	display:none;
	position:fixed;
	top:20%;
	left:50%;
	transform:translateX(-50%);
	background:white;
	padding:20px;
	border-radius:12px;
	z-index:9999;
	text-align:center;
">

	<h3>Подключить телефон</h3>

	<img id="qrImg" style="width:220px;">

</div>

</form>

<audio id="beepSound" preload="auto">
    <source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" type="audio/ogg">
</audio>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script>
document.querySelector("input[name='name']").addEventListener("input", function() {
    const value = this.value;
    const options = document.querySelectorAll("#itemsList option");

    options.forEach(option => {
        if (option.value === value) {
            document.getElementById("retail_price").value = option.dataset.price || "";
            document.getElementById("categoryInput").value = option.dataset.category || "";
            document.querySelector("textarea[name='description']").value = option.dataset.description || "";
        }
    });
});

const modal = document.getElementById("categoryModal");
const categoryInput = document.getElementById("categoryInput");
const categoryDropdown = document.getElementById("categoryDropdown");

document.getElementById("openCategoryModal").addEventListener("click", () => {
    modal.style.display = "flex";
});

categoryInput.addEventListener("focus", () => {
    categoryDropdown.style.display = "block";
});

categoryInput.addEventListener("click", () => {
    categoryDropdown.style.display = "block";
});

document.addEventListener("click", (e) => {
    if (!e.target.closest(".category-wrapper")) {
        categoryDropdown.style.display = "none";
    }
});

async function deleteCategory(event, id) {
    event.stopPropagation();

    if (!confirm("Удалить категорию?")) return;

    await fetch(`/delete_category/${id}`, {
        method: "POST"
    });

    location.reload();
}

document.getElementById("saveCategoryBtn").addEventListener("click", async () => {
    try {
        const name = document.getElementById("newCategoryName").value.trim();
        const markup = document.getElementById("newCategoryMarkup").value.trim();

        if (!name) {
            alert("Введите название категории");
            return;
        }

        const response = await fetch("/add_category", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name,
                markup
            })
        });

        const data = await response.json();

        const div = document.createElement("div");
        div.className = "category-option";
		div.setAttribute(
			"onclick",
			`selectCategory('${data.name}', '${data.markup_percent || markup}')`
		);

        div.innerHTML = `
            <div>
                <b>${data.name}</b>
                <span class="markup">${data.markup_percent || markup || 0}%</span>
            </div>
            <button
                type="button"
                class="delete-category"
                onclick="deleteCategory(event, ${data.id})"
            >
                🗑
            </button>
        `;

        categoryDropdown.appendChild(div);

        categoryInput.value = data.name;

        modal.style.display = "none";

        document.getElementById("newCategoryName").value = "";
        document.getElementById("newCategoryMarkup").value = "";

        alert("Категория успешно добавлена");

    } catch (error) {
        console.error(error);
        alert("Ошибка при добавлении категории");
    }
});

let currentMarkup = 0;

function selectCategory(name, markup) {

    categoryInput.value = name;

    currentMarkup = parseFloat(markup) || 0;

    categoryDropdown.style.display = "none";

    calculatePurchasePrice();
}

function calculatePurchasePrice(){

    const retail =
        parseFloat(
            document.getElementById("retail_price").value
        ) || 0;

    if(retail <= 0) return;

    const purchase =
        retail - (retail * currentMarkup / 100);

    document.getElementById("purchase_price").value =
        Math.round(purchase);
}

document
.getElementById("retail_price")
.addEventListener("input", calculatePurchasePrice);

document.addEventListener("DOMContentLoaded", () => {

    const currentUnit = "{{ item.unit if item else 'шт' }}";

    document.getElementById("unitSelect").value = currentUnit;

});

async function openScanner() {

    const readerEl = document.getElementById("reader");
    document.getElementById("scannerModal").style.display = "flex";

    // 🔥 очищаем
    readerEl.innerHTML = "";

    // 🔥 создаём видео вручную
    const video = document.createElement("video");
    video.setAttribute("autoplay", true);
    video.setAttribute("playsinline", true);
    video.style.width = "100%";
    video.style.height = "auto";

    readerEl.appendChild(video);

    try {

        // 🔥 ВКЛЮЧАЕМ КАМЕРУ НАПРЯМУЮ
        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: { ideal: "environment" }
            }
        });

        video.srcObject = stream;

        // 🔥 ждём пока реально появится картинка
        await video.play();

		// 🔥 НАТИВНЫЙ СКАНЕР БРАУЗЕРА — вместо ZXing
		if (!("BarcodeDetector" in window)) {
			alert("Этот браузер не поддерживает быстрый сканер. Попробуй Chrome на Android.");
			return;
		}

		const barcodeDetector = new BarcodeDetector({
			formats: [
				"ean_13",
				"ean_8",
				"code_128",
				"code_39",
				"upc_a",
				"upc_e"
			]
		});

		let lastDetectedCode = "";
		let lastDetectedTime = 0;

		async function scanFrame() {
			try {
				const barcodes = await barcodeDetector.detect(video);

				if (barcodes.length > 0) {
					const code = barcodes[0].rawValue;
					const now = Date.now();

					if (code.length >= 8 && code.length <= 14) {

						// защита от дублей
						if (!(code === lastDetectedCode && now - lastDetectedTime < 1200)) {

							lastDetectedCode = code;
							lastDetectedTime = now;

							console.log("BARCODE DETECTOR:", code);

							const beep = document.getElementById("beepSound");
							if (beep) {
								beep.currentTime = 0;
								beep.play().catch(() => {});
							}

							if (navigator.vibrate) {
								navigator.vibrate(120);
							}

							document.getElementById(
								"barcodeInput"
							).value = code;

							closeScanner();
						}
					}
				}
			} catch (err) {
				console.log("SCAN FRAME ERROR:", err);
			}

			requestAnimationFrame(scanFrame);
		}

        scanFrame();

    } catch (err) {

        console.error("CAMERA ERROR:", err);
        alert("Не удалось запустить камеру");

    }
}

function closeScanner() {

    document.getElementById("scannerModal").style.display = "none";

    const video = document.querySelector("#reader video");

    if (video && video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
    }
}

let barcodeBuffer = "";
let lastKeyTime = 0;

document.getElementById(
    "barcodeInput"
).addEventListener("keydown", (e) => {

    const now = Date.now();

    // 🔥 если пауза большая — новый скан
    if (now - lastKeyTime > 100) {
        barcodeBuffer = "";
    }

    lastKeyTime = now;

    // 🔥 Enter = конец скана
    if (e.key === "Enter") {

        if (barcodeBuffer.length >= 8) {

            console.log(
                "USB Скан:",
                barcodeBuffer
            );

            const beep =
                document.getElementById(
                    "beepSound"
                );

            if (beep) {
                beep.currentTime = 0;
                beep.play().catch(() => {});
            }

            document.getElementById(
                "barcodeInput"
            ).value = barcodeBuffer;
        }

        barcodeBuffer = "";

        e.preventDefault();

        return;
    }

    // 🔥 только цифры
    if (/[0-9]/.test(e.key)) {
        barcodeBuffer += e.key;
    }

});

let sessionId = null;

function showQR() {

    fetch("/api/create-session")
    .then(res => res.json())
    .then(data => {

        sessionId = data.session;

        const url =
            window.location.origin +
            "/scanner?session=" +
            sessionId;

        QRCode.toDataURL(url, function (err, urlImg) {

            document.getElementById(
                "qrImg"
            ).src = urlImg;

            document.getElementById(
                "qrBox"
            ).style.display = "block";

        });

        startListening();
    });
}

function startListening() {

    const interval = setInterval(() => {

        if (!sessionId) return;

        fetch("/api/get-scan/" + sessionId)
        .then(res => res.json())
        .then(data => {

            if (data.code) {

                const beep =
                    document.getElementById(
                        "beepSound"
                    );

                if (beep) {
                    beep.currentTime = 0;
                    beep.play().catch(() => {});
                }

                document.getElementById(
                    "barcodeInput"
                ).value = data.code;

                document.getElementById(
                    "qrBox"
                ).style.display = "none";

                clearInterval(interval);
            }

        });

    }, 300);
}

</script>

<style>
.category-row{
    display:flex;
    gap:10px;
    align-items:center;
}

.category-row input{
    flex:1;
}

.modal{
    display:none;

    position:fixed;
    inset:0;

    background:rgba(0,0,0,0.5);

    justify-content:center;
    align-items:center;

    z-index:999;
}

.modal-content{
    width:350px;

    background:white;

    border-radius:12px;

    padding:20px;

    display:flex;
    flex-direction:column;
    gap:12px;
}

.category-wrapper{
    position:relative;
}

.category-dropdown{

    position:absolute;

    top:100%;
    left:0;
    right:0;

    background:white;

    border:1px solid #ddd;

    border-radius:10px;

    max-height:250px;

    overflow:auto;

    display:none;

    z-index:999;
}

.category-option{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:10px;

    cursor:pointer;
}

.category-option:hover{
    background:#f5f5f5;
}

.markup{
    color:green;
    margin-left:8px;
}

.delete-category{

    border:none;
    background:none;

    cursor:pointer;

    font-size:16px;
}

.item-grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:16px;

    margin-top:20px;
}

.item-grid input,
.item-grid select,
.item-grid textarea{

    width:100%;

    padding:12px;

    border-radius:12px;

    border:1px solid #ddd;

    box-sizing:border-box;
}

.full{
    grid-column:1/-1;
}

.item-grid textarea{
    min-height:120px;
}

.barcode-row{

    display:flex;

    gap:10px;

    align-items:center;
}

.barcode-row input{
    flex:1;
}

.scan-btn{

    width:52px;
    height:52px;

    border:none;

    border-radius:12px;

    background:#2563eb;

    color:white;

    font-size:22px;

    cursor:pointer;
}

.scanner-modal {

    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,0.8);

    z-index: 9999;

    justify-content: center;
    align-items: center;
}

.scanner-box {

    background: #000;

    padding: 10px;

    border-radius: 12px;

    text-align: center;
}

#reader {

    width: 420px;
    height: 280px;

    position: relative;

    overflow: hidden;

    border-radius: 14px;

    background: #000;
}

#reader video,
#reader canvas {

    width: 100% !important;
    height: 100% !important;

    object-fit: cover;
}

#reader::after {

    content: "";

    position: absolute;

    top: 50%;
    left: 50%;

    width: 78%;
    height: 95px;

    transform: translate(-50%, -50%);

    border: 3px solid #ff3333;

    border-radius: 12px;

    box-shadow:
        0 0 0 999px rgba(0,0,0,0.35);

    pointer-events: none;

    z-index: 10;
}

@media (max-width: 600px) {

    #reader {

        width: 92vw;
        height: 55vh;
    }

    .scanner-box {
        width: 95vw;
    }
}

@media(max-width:768px){

    .item-grid{
        grid-template-columns:1fr;
    }
}
</style>

{% endblock %}
